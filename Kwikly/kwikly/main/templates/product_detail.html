{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.product_name }} - Product Details</title>
    <link href="https://fonts.googleapis.com/css?family=Bentham|Playfair+Display|Raleway:400,500|Suranna|Trocchi" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'product_detail.css' %}">
</head>
<body>
    <!-- Header -->
    <header>
        {% include 'components/navbar.html' %}
    </header>

    <!-- Product Section -->
    <div class="wrapper">
        <div class="product-img">
            <img src="{% if product.image %}{{ product.image.url }}{% else %}{% static 'images/default-product.jpg' %}{% endif %}" height="420" width="327" alt="{{ product.product_name }}">
        </div>

        <div class="product-info">
            <div class="product-text">
                <h1>{{ product.product_name }}</h1>
                <h2>{{ product.category.name }}</h2>
                <p>{{ product.description }}</p>
                <p><span style="font-size: 34px; font-weight: bold; font-family: 'Montserrat', sans-serif; color: black;">{{ product.price }}</span> ₱</p>


            </div>
           
            <div class="product-price-btn">
                
                
                <form method="POST" action="/cart/add/" onsubmit="console.log('Submitting form with quantity:', document.getElementById('quantity').value);">
                    {% csrf_token %}
                    <input type="hidden" name="product_id" value="{{ product.product_id }}">
                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1">
                    <br>
                    <br>
                    <button type="submit">Add to Cart</button>
                </form>
            </div>
            
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        {% include "components/footer.html" %}
    </footer>
</body>
</html>
