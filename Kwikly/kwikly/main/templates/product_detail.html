{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.product_name }} - Product Details</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <!-- Header -->
    <header>
        <a href="{% url 'store' %}">← Back to Store</a>
    </header>

    <!-- Product Details -->
    <div class="product-detail">
        <h1>{{ product.product_name }}</h1>
        <div class="image-container">
            <img src="{% if product.image %}{{ product.image.url }}{% else %}{% static 'images/default-product.jpg' %}{% endif %}" alt="{{ product.product_name }}">
        </div>
        <p>Category: {{ product.category.name }}</p>
        <p>Store: {{ product.store.store_name }}</p>
        <p>Price: ₱{{ product.price }}</p>

        <!-- Add to Cart Form -->
        <form method="POST" action="/cart/add/" onsubmit="console.log('Submitting form with quantity:', document.getElementById('quantity').value);">
            {% csrf_token %}
            <input type="hidden" name="product_id" value="{{ product.product_id }}">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" value="1" min="1">
            <button type="submit">Add to Cart</button>
        </form>
    </div>
</body>
</html>
