{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwikly - Stores</title>
    <link rel="stylesheet" href="{% static 'stores.css' %}">
</head>
<body>
    {% include 'components/navbar.html' %}

    <main class="main-content">
    
        
        <!-- New Image Section -->
        <section class="featured-image">
        <img src="{% static 'images/desktop-doorstep-store.png' %}" alt="Featured Image" class="desktop-doorstep-image">
        </section>

        <!-- Stores Section -->
        <section class="stores">
            <h1>Stores Around You</h1>
            <div class="store-grid">
                {% for store in stores %}
                <div class="store-card">
                    <a href="{% url 'store_detail' store.store_id %}">
                        {% if store.image %}
                            <img src="{{ store.image.url }}" alt="{{ store.store_name }}">
                        {% else %}
                            <img src="{% static '' %}" alt="Default Store Image"> <!-- Provide a default image -->
                        {% endif %}
                        <h3>{{ store.store_name }}</h3>
                        <p>{{ store.description|default:"" }}</p>
                    </a>
                </div>
                {% endfor %}
            </div>
        </section>
    </main>

    <footer>
        {% include "components/footer.html" %}
    </footer>

    <script>
        // JavaScript for automatic Ad Carousel sliding
        const adItems = document.querySelectorAll('.ad-carousel-item');
        const adInner = document.querySelector('.ad-carousel-inner');
        let currentAdIndex = 0;

        function slideAds() {
            currentAdIndex = (currentAdIndex + 1) % adItems.length; // Loop back to the start
            adInner.style.transform = `translateX(-${currentAdIndex * 100}%)`;
        }

        // Slide every 4 seconds
        setInterval(slideAds, 4000);
    </script>
</body>
</html>
