{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Categories</title>
    <link rel="stylesheet" href="{% static 'manages_style.css' %}">
</head>
<body>
    {% include 'header.html' %}
    <h2>Manage Categories</h2>
    <div class="center-container">
        <a href="{% url 'add_category' %}" class="add-user-btn">Add Category</a>
        <table>
            <thead>
                <tr>
                    <th>Category Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for category in categories %}
                <tr>
                    <td>{{ category.type }}</td>
                    <td>
                        <a href="{% url 'edit_category' category.category_id %}" class="edit-btn">Edit</a>
                        <a href="{% url 'delete_category' category.category_id %}" class="delete-btn" onclick="return confirm('Are you sure you want to delete this category?');">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="{% url 'admin_dashboard' %}" class="back-link">Back to Dashboard</a>
    </div>
</body>
</html>
