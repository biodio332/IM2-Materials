{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link rel="icon" type="image/x-icon" href="/media/uploads/products/kwikly.png">
    <link rel="stylesheet" href="{% static 'edit_style.css' %}">
</head>
<body>
    {% include 'header.html' %}
    <div class="center-container">
        <h2>Edit User: {{ user.username }}</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <!-- Name Input -->
            <label for="name">Name</label>
            <input type="text" name="name" value="{{ user.name }}" required>
            
            <!-- Contact Input -->
            <label for="contact">Contact</label>
            <input type="text" name="contact" value="{{ user.contact }}" required>
            
            <!-- Address Input -->
            <label for="address">Address</label>
            <input type="text" name="address" value="{{ user.address }}" required>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Update User</button>
        </form>
        
        <!-- Back Link -->
        <a href="{% url 'manage_users' %}" class="back-link">Back to Manage Users</a>
    </div>
</body>
</html>
