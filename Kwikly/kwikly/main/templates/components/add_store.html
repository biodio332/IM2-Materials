{% load static %}
<link rel="stylesheet" href="{% static 'add_style.css' %}">
<link rel="icon" type="image/x-icon" href="/media/uploads/products/kwikly.png">
<div class="center-container">
    <h2>Add New Store</h2>

    <form method="POST" enctype="multipart/form-data"> <!-- Add enctype -->
        {% csrf_token %}

        <!-- Store Name Field -->
        <div class="input-group">
            <label for="store_name">Store Name</label>
            <input type="text" id="store_name" name="store_name" required>
        </div>

        <!-- Address Field -->
        <div class="input-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" required>
        </div>

        <!-- Image Upload Field -->
        <div class="input-group">
            <label for="store_image">Upload Store Image</label>
            <input type="file" id="image" name="image" >
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">Add Store</button>
    </form>

    <!-- Back to Stores Link -->
    <a href="{% url 'manage_stores' %}" class="back-link">Back to Stores</a>
</div>
