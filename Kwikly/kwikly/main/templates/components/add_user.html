{% load static %}
<link rel="stylesheet" href="{% static 'add_style.css' %}">
<link rel="icon" type="image/x-icon" href="/media/uploads/products/kwikly.png">
<header>
    <!-- Header content here -->
</header>

<div class="center-container">
    <h2>Add New User</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Username Field -->
        <div class="input-group">
            <label for="username">Username:</label>
            <input type="text" name="username" required>
        </div>

        <!-- Password Field -->
        <div class="input-group">
            <label for="password">Password:</label>
            <input type="password" name="password" required>
        </div>

        <!-- Name Field -->
        <div class="input-group">
            <label for="name">Name:</label>
            <input type="text" name="name" required>
        </div>

        <!-- Contact Field -->
        <div class="input-group">
            <label for="contact">Contact:</label>
            <input type="text" name="contact" required>
        </div>

        <!-- Address Field -->
        <div class="input-group">
            <label for="address">Address:</label>
            <input type="text" name="address" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">Add User</button>
    </form>

    <!-- Back to Manage Users Link -->
    <a href="{% url 'manage_users' %}" class="back-link">Back to Manage Users</a>
</div>
