{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Order Product</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    {% include 'header.html' %}
    <div class="center-container">
        <h2>Add Order Product</h2>
        <form method="POST">
            {% csrf_token %}

            <!-- Product -->
            <div class="input-group">
                <label for="product">Product:</label>
                <select id="product" name="product" required>
                    {% for product in products %}
                        <option value="{{ product.id }}">{{ product.product_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Quantity -->
            <div class="input-group">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" name="quantity" step="1" required>
            </div>

            <!-- Price -->
            <div class="input-group">
                <label for="price">Price:</label>
                <input type="number" id="price" name="price" step="0.01" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Add Order Product</button>
        </form>
        <a href="{% url 'view_order' order_id %}" class="back-link">Back to Order</a>
    </div>
</body>
</html>
